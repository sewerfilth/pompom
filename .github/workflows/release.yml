name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-x86_64,   arch: x86_64, ext: tar.gz }
          - { os: ubuntu-latest,  target: linux-i686,     arch: x86_32, ext: tar.gz }
          - { os: windows-latest, target: windows-x86_64, arch: x86_64, ext: zip,   msvc_arch: x64 }
          - { os: windows-latest, target: windows-i686,   arch: x86_32, ext: zip,   msvc_arch: x86 }
          - { os: macos-13,       target: macos-x86_64,   arch: x86_64, ext: tar.gz }
          - { os: macos-14,       target: macos-arm64,    arch: arm,    ext: tar.gz }
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install gcc-multilib (Linux i686)
        if: matrix.target == 'linux-i686'
        run: sudo apt-get install -y gcc-multilib

      - name: Install nasm (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress

      - name: Setup MSVC dev cmd
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: make ARCH=${{ matrix.arch }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set PATH=C:\ProgramData\chocolatey\bin;%PATH%
          call build.bat --target ${{ matrix.arch }}

      - name: Locate build output
        id: locate
        shell: bash
        run: |
          set -e
          if [ "${{ runner.os }}" = "Windows" ]; then
            LIB=$(ls build/win/pompom.lib build/win/libpompom.lib build/win/libpompom.a 2>/dev/null | head -1)
            if [ -z "$LIB" ]; then LIB=$(find build -name 'pompom.lib' -o -name 'libpompom.*' | head -1); fi
          else
            LIB="build/${{ matrix.arch }}/libpompom.a"
          fi
          echo "lib=$LIB" >> "$GITHUB_OUTPUT"
          echo "Found: $LIB"

      - name: Stage artifacts
        shell: bash
        run: |
          set -e
          NAME="pompom-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$NAME/lib" "dist/$NAME/include"
          cp "${{ steps.locate.outputs.lib }}" "dist/$NAME/lib/"
          cp -R include/pompom "dist/$NAME/include/"
          cp README.md LICENSE LICENSE.md "dist/$NAME/"

      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          cd dist && tar czf "../pompom-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" "pompom-${{ github.ref_name }}-${{ matrix.target }}"

      - name: Package (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/pompom-${{ github.ref_name }}-${{ matrix.target }}" -DestinationPath "pompom-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: pompom-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/pompom-*
          draft: false
          generate_release_notes: true
